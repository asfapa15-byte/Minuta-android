{"name": "Construieste APK", "on": ["push", "workflow_dispatch"], "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4", "with": {"fetch-depth": 0}}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.14.3"}}, {"name": "Build", "run": "Z=$(git log -1 --pretty=format: --name-only --diff-filter=AM -- '*.zip' | grep -m1 '\\.zip$'); echo \"Folosesc arhiva: $Z\"; unzip -o \"$Z\" && cd MinutaAndroid && grep versionName app/build.gradle.kts && gradle assembleDebug --no-daemon"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "Minuta-apk", "path": "MinutaAndroid/app/build/outputs/apk/debug/*.apk"}}]}}}
