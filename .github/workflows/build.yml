{"name": "Construieste APK", "on": ["push", "workflow_dispatch"], "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.14.3"}}, {"name": "Build", "run": "unzip -o '*.zip' && cd MinutaAndroid && find app -type f | head -60 && gradle assembleDebug --no-daemon"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "Minuta-apk", "path": "MinutaAndroid/app/build/outputs/apk/debug/*.apk"}}]}}}
